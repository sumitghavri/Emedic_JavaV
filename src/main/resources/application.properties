spring.application.name=management
server.port=8087
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/doctormanagement}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Bridge the uppercase local .env keys into Spring's canonical property names.
emedic.security.jwt.issuer-uri=${EMEDIC_SECURITY_JWT_ISSUER_URI:}
emedic.security.jwt.jwk-set-uri=${EMEDIC_SECURITY_JWT_JWK_SET_URI:}
emedic.security.jwt.audience=${EMEDIC_SECURITY_JWT_AUDIENCE:}
emedic.security.jwt.roles-claim=${EMEDIC_SECURITY_JWT_ROLES_CLAIM:roles}
emedic.web.allowed-origins=${EMEDIC_WEB_ALLOWED_ORIGINS:http://localhost:5173}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false


spring.jpa.open-in-view=false
spring.sql.init.mode=always
